rm_behavior_tree:
  robot_type: "sentry"
  init_gyro_state: false
  minimap2map: [ 21.782, 7.478, 3.1415926 ] #----  已更改
  enable_conduct_patrol: true
  robot_color: "blue"

  pose_sanity:
    enable: true
    map_frame: "map"
    base_frame: "base_link"
    # Effective valid map bounds in map frame. This is checked before BT area
    # detection, so obviously corrupt localization such as x=-765 is rejected.
    # Format: [min_x, max_x, min_y, max_y, min_z, max_z].
    map_bounds: [ -100.0, 100.0, -100.0, 100.0, -10.0, 10.0 ]
    bounds_margin: 0.5
    max_jump_distance: 0.0
    trigger_relocate: true

  planner:
    move_gyro_vel: 8.0
    limit_vel: 0.8
    default_limit_vel: 6.0
    attack_remain_time: 10.0 #--------
    slope_side_window: 0.6
    default_side_window: 0.3
    neutral_cost: 40  #------------
    lethal_cost: 253  #-------------

  chassis:
    topic: "/cmd_chassis"
    accel_x:
      - [ 50.0,99.0 ]
    accel_y:
      - [ 50.0,99.0 ]
    accel_z:
      - [ 50.0,99.0 ]
    max_power_limit: 240.0
    safety_power: 100
    standard_power: 80.0
    disable_cap_gyro_threshold: 0.15
    enable_cap_gyro_threshold: 0.25
    enable_use_cap_threshold: 0.25
    disable_use_cap_threshold: 0.15
    is_new_capacitor: false  #---------
    capacitor_threshold: 0.3 #---------
    charge_power: 0 #---------
    extra_power: 0 #--------
    burst_power: 220 #---------
    buffer_threshold: 10 #-----------
    total_burst_time: 5
    power_gain: 0 #------------
  vel:
    topic: "/cmd_vel"
    power_limit_topic: "/cmd_chassis"
    max_linear_x:
      - [ 150.0,3.14 ]
    max_linear_y:
      - [ 150.0,3.14 ]
    max_angular_z:
      - [ 150.0,6.7 ]
    gyro_move_reduction: 1.0
    gyro_rotate_reduction: 1.0
    still_gyro_vel: 5.0

  auto:
    #hero(5),engineer(3->0),standard3(2<->4),standard4,standard5,outpost(5),sentry(0->3),base
    default_aim_priority: [ 5, 3, 2, 2, 2, 5, 1, 0 ] #--------
    #    default_aim_priority: [ 0, 0, 0, 0, 0, 0, 0, 0 ]
    attack_engineer_enable: true
    attack_engineer_time_interval: [ 0.0, 420.0 ]
    attack_outpost_enable: false
    attack_outpost_time_interval: [ 50.0, 90.0 ]
    game_total_time: 300.0
    base_open_time_threshold: 15.0  #<30 HpReturnArea to CenterSentryPatrolArea
    base_open_time_threshold_before_4min: 40.0
    base_open_time_threshold_after_4min: 15.0
    enemy_urgent_hp: 50
    lost_track_tolerant_sec: 0.18
    chasing_max_for_time: 5.0
    avoid_drone_time: 30.0
    stop_gyro_delay_time: 1.0
    area_under_stair: [ "rolling_road_area","blue_outpost_area","red_outpost_area" ]
    enable_delete_stair_wall: false
    set_stair_wall_delay: 0.7
    bake_home_high_hp_threshold: 300
    back_home_low_hp_threshold: 50
    k_meter: 25
    attack_area: [ ]
    defense_area: [ ]
    moveing_area: [ ]
